# Standard build settings
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# DAO unit tests build a Room in-memory DB with a stubbed Context; returning
# default values (instead of throwing) keeps framework stubs quiet.
android.returnDefaultValues=true
org.gradle.configuration-cache=true

# --- Google Maps API key (secret, NOT committed) -----------------------------
# Put your real Maps key in a local, gitignored override (e.g. ~/.gradle/gradle.properties
# or a gitignored local.properties entry is NOT read here). The template below is
# committed with an EMPTY value so builds never break on a clean checkout.
# Build script injects it into the manifest via resValue; an empty value simply
# injects an empty string, and the app detects that and shows its no-key state.
GOOGLE_MAPS_API_KEY=

# Release keystore (also NOT committed; see printSigningSha1 task)
# ANDROID_RELEASE_KEYSTORE=/abs/path/release.keystore
# ANDROID_RELEASE_KEYSTORE_PASS=...
